id: seguridad-secreto
term: Secreto
category: seguridad
level: basico
summary: "Cualquier dato que no debe ser público: claves, contraseñas, tokens. Si se filtra, se cambia; no basta con borrarlo."
body: |
  Los secretos viven en variables de entorno o en un gestor de secretos, nunca escritos
  en el código.
  La trampa: borrar el secreto en un commit nuevo no lo saca del historial de Git. Si
  llegó a un repo, se considera comprometido: se revoca y se genera uno nuevo.
example: |
  git log -p -S "sk-ant-" --all | head
why: "Ante una filtración, rotar la clave es lo único que la invalida de verdad."
source: https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
related: [seguridad-env-file, seguridad-api-key, git-gitignore, permisos-deny-rule]
updated: 2026-09-29
