id: arquitectura-timeout
term: Timeout
category: arquitectura
level: intermedio
summary: "El tiempo máximo que se espera una operación antes de darla por fallida y cancelarla."
body: |
  Sin timeout, una petición a un servidor que no responde puede dejar tu programa
  colgado para siempre.
  La trampa: un timeout no significa que la operación no ocurrió. Un pago que dio timeout
  pudo haberse procesado; reintentar a ciegas puede cobrar dos veces.
example: |
  const r = await fetch("https://github.com", { signal: AbortSignal.timeout(5000) });
  console.log(r.status);
why: "Poner timeout a cada llamada de red evita procesos colgados sin error visible."
source: https://developer.mozilla.org/en-US/docs/Web/API/AbortSignal/timeout_static
related: [arquitectura-latencia, fundamentos-promesa]
updated: 2026-09-29
