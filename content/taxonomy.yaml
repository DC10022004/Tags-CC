# Categorías y niveles válidos. validate.mjs falla si una tarjeta usa algo que no está aquí.
categories:
  - id: cli
    nombre: CLI y sesión
    descripcion: Comandos, flags, atajos y manejo de la sesión interactiva.
  - id: contexto
    nombre: Contexto y memoria
    descripcion: CLAUDE.md, auto memory, ventana de contexto, compactación.
  - id: hooks
    nombre: Hooks
    descripcion: Eventos del ciclo de vida que ejecutan tus scripts.
  - id: skills
    nombre: Skills y comandos
    descripcion: SKILL.md, comandos propios, skills incluidas.
  - id: subagentes
    nombre: Subagentes
    descripcion: Delegación a agentes con su propio contexto.
  - id: mcp
    nombre: MCP e integraciones
    descripcion: Model Context Protocol, servidores, conectores.
  - id: permisos
    nombre: Permisos y seguridad
    descripcion: Modos de permiso, reglas, sandbox.
  - id: configuracion
    nombre: Configuración
    descripcion: settings.json, variables de entorno, precedencia.
  - id: workflow
    nombre: Flujos de trabajo
    descripcion: Patrones de uso, worktrees, revisión de código.
  - id: plataforma
    nombre: Plataforma
    descripcion: SDK, plugins, IDE, web, escritorio, CI.

  # Programación general (ADR 0005). Fuentes: glosario de MoureDev y el diccionario
  # técnico personal de Diego; el texto de cada tarjeta es propio.
  - id: fundamentos
    nombre: Fundamentos de programación
    descripcion: Variables, tipos, funciones, control de flujo, errores.
  - id: algoritmos
    nombre: Algoritmos y estructuras de datos
    descripcion: Complejidad, arrays, pilas, colas, hashing.
  - id: paradigmas
    nombre: Paradigmas y patrones
    descripcion: POO, programación funcional e imperativa, patrones de diseño.
  - id: web
    nombre: Web y APIs
    descripcion: HTTP, URLs, REST, navegador, renderizado.
  - id: datos
    nombre: Bases de datos y formatos
    descripcion: SQL, NoSQL, esquemas, migraciones, JSON, YAML.
  - id: ia
    nombre: IA y ciencia de datos
    descripcion: LLMs, machine learning, análisis de datos.
  - id: git
    nombre: Git y GitHub
    descripcion: Commits, ramas, remotos, merge, pull requests.
  - id: arquitectura
    nombre: Arquitectura de software
    descripcion: Frontend y backend, monolitos, concurrencia, caché, latencia.
  - id: infra
    nombre: Infraestructura y despliegue
    descripcion: Nube, contenedores, CI/CD, deployment, sistema operativo.
  - id: seguridad
    nombre: Seguridad y secretos
    descripcion: Claves de API, .env, cifrado, autenticación.
  - id: herramientas
    nombre: Herramientas de desarrollo
    descripcion: Compiladores, runtimes, terminal, npm, dependencias.
  - id: proceso
    nombre: Calidad y proceso
    descripcion: Testing, depuración, revisión de código, ágil, diseño de producto.

levels: [basico, intermedio, avanzado]
